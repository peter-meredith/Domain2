name: CI/CD
on: workflow_dispatch
jobs:
    build:
        name: CI/CD
        runs-on: ubuntu-latest
        strategy:
            matrix:
                color: ["red"]
        outputs:
            color: ${{matrix.color}}
        uses: ./.github/workflows/m-build.yml
        with:
            color: ${{matrix.color}}
    test:
        needs: build
        runs-on: ubuntu-latest
        uses: ./.github/workflows/m-test.yml
        with:
            color: ${{needs.build.outputs.color}}
