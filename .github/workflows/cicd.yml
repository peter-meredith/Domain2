name: CI/CD
on: workflow_dispatch
jobs:
    build:
        name: Build Mega Code
        strategy:
            matrix:
                color: ["red"]
        outputs:
            color: ${{matrix.color}}
        uses: ./.github/workflows/m-build.yml
        with:
            color: ${{matrix.color}}
    test:
        name: Test Mega Code
        needs: build
        uses: ./.github/workflows/m-test.yml
        with:
            color: ${{needs.build.outputs.color}}
