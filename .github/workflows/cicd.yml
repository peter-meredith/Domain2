name: CI/CD
on: workflow_dispatch
env:
    colors: "red"
jobs:
    build:
        name: Build Mega Code
        strategy:
            matrix:
                color: ${{env.colors}}
        uses: ./.github/workflows/m-build.yml
        with:
            color: ${{matrix.color}}
    test:
        name: Test Mega Code
        needs: build
        strategy:
            matrix:
                color: ${{env.colors}}
        uses: ./.github/workflows/m-test.yml
        with:
            color: ${{matrix.color}}
