name: CI/CD
on: workflow_dispatch
jobs:
    build:
        name: Build Mega Code
        outputs:
            color: "red"
        strategy:
            matrix:
                color: ["red"]
        uses: ./.github/workflows/m-build.yml
        with:
            color: ${{matrix.color}}
    test:
        name: Test Mega Code
        needs: build
        uses: ./.github/workflows/m-test.yml
        with:
            color: "red"
