name: CI/CD
on: workflow_dispatch
env:
    environments: ["production", "staging", "development"]
jobs:
    build:
        name: CI/CD
        strategy:
            matrix:
                color: ["red"]
        outputs:
            color: ${{matrix.color}}
        uses: ./.github/workflows/m-build.yml
        with:
            color: ${{matrix.color}}
    test:
        needs: build
        uses: ./.github/workflows/m-test.yml
        with:
            color: ${{needs.build.outputs.color}}
